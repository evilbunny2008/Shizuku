def androidComponentsForSdk = project.extensions.getByType(com.android.build.api.variant.AndroidComponentsExtension)
def sdkDirProvider = androidComponentsForSdk.sdkComponents.sdkDirectory

def collapseReleaseResourceNames = tasks.register("collapseReleaseResourceNames") {
    def zip = Paths.get(project.buildDir.path, "intermediates",
        "optimized_processed_res", "release", "optimizeReleaseResources", "resources-release-optimize.ap_")
    doLast {
        def sdkDir = sdkDirProvider.get().asFile
        def aapt2 = new File(sdkDir, "build-tools/${android.buildToolsVersion}/aapt2")

        def optimized = new File("${zip}.opt")
        def execOps = services.get(ExecOperations)
        execOps.exec {
            commandLine aapt2, "optimize", "--collapse-resource-names",
                "--resources-config-path", "aapt2-resources.cfg",
                "-o", optimized, zip.toFile()
            ignoreExitValue = false
        }
        if (optimized.exists()) {
            delete(zip.toFile())
            optimized.renameTo(zip.toFile())
        }
    }
}

afterEvaluate {
    tasks.getByName("optimizeReleaseResources").finalizedBy(collapseReleaseResourceNames)
    tasks.getByName("preReleaseBuild").dependsOn(":shell:assembleRelease")
    tasks.getByName("preDebugBuild").dependsOn(":shell:assembleDebug")
}

def androidComponents = project.extensions.getByType(AndroidComponentsExtension)

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.outputs.each { output ->
        output.outputFileName.set("shizuku-v${rootProject.ext.versionName}-${variant.name}.apk")
    }

    def isMinified = android.buildTypes.getByName(variant.buildType).minifyEnabled
    def assembleTaskName = "assemble${variant.name.capitalize()}"

    tasks.matching { it.name == assembleTaskName }.configureEach { t ->
        t.doLast {
            def outDir = new File(rootDir, "out")
            def mappingDir = new File(outDir, "mapping")
            def apkDir = new File(outDir, "apk")

            if (isMinified) {
                def mappingFile = variant.artifacts
                        .get(SingleArtifact.OBFUSCATION_MAPPING_FILE)
                        .get().asFile
                copy {
                    from mappingFile
                    into mappingDir
                    rename { "mapping-${rootProject.ext.versionName}.txt" }
                }

                def apkFolder = variant.artifacts
                        .get(SingleArtifact.APK)
                        .get().asFile
                copy {
                    from apkFolder
                    into apkDir
                    include "*.apk"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("CompileArtProfile") }.configureEach {
